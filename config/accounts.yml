# 監視するXアカウント（@は不要）
#   type:   aggregator（抽選情報まとめ） / retailer（小売店） / maker（メーカー）
#   genres: tcg / game / hobby / goods（ジャンルが読み取れなかったときの補助）
#   filter: true にすると「抽選・応募…」を含む投稿だけ取得（課金を抑える。既定 true）
#
# 2026-11-24 に各アカウントの実際の投稿を確認して選定。2026-11-25 に2つを入れ替え（下のコメント参照）。
# ハンドル名が変わると取得できなくなります（毎朝のダイジェストで「投稿がない」と警告されたら確認してください）。
accounts:
  - handle: crashseq
    note: >-
      たぬき🔔トレカ抽選速報。TCGの網羅性が最も高い（1週間で約245件）。
      朝・夕・夜の定時まとめで、1投稿に数十〜100件超。大半は地方の店頭抽選で、
      それらはAIが除外する（ネット抽選の貢献が少なければ外す候補。設定画面の件数で確認）
    type: aggregator
    genres: [tcg]
  - handle: premium_kakaku
    note: >-
      プレミア価格人気商品。「応募：〜〆 当選：〜 購入：〜」の整った形。
      ポケカ・ドラゴンボールカード・ちいかわ等のグッズも扱う（広告 #PR は除外）
    type: aggregator
    genres: [tcg, goods]
  - handle: SelectInfoDeals
    note: >-
      厳選info。毎晩23時ごろにジャンル別の抽選まとめを3本（ポケカ／ワンピ／DB・遊戯王・ベイブレード・フィギュア）。
      プレバン・タカラトミーモール・イオンスタイル等。日中の投稿はほぼ広告（#PR は除外）
    type: aggregator
    genres: [tcg, hobby, goods]
  # ---- 2026-11-25 追加（1週間ほど試し、設定画面の「単独」の件数が少なければ外す）
  - handle: stock_alertv2
    note: >-
      在庫通知ラボ。通販ショップ限定の抽選（ホビビ通販部など）や、ポケモンセンターオンラインの高額グッズ
      （例：Fender×ポケモン ギター 39.6万円）など、TCG以外の抽選も拾う。抽選の投稿は1日5件前後
    type: aggregator
    genres: [tcg, goods]
  - handle: p_bandai
    note: >-
      プレミアムバンダイ公式。METAL BUILD・S.H.Figuarts などフィギュア・プラモの抽選販売を一次情報で。
      すべてネット（配送）。抽選は週に数件
    type: retailer
    genres: [hobby, tcg]
  - handle: datto_TCG
    note: >-
      ダットトレカ。毎日の「受付中の抽選・予約」一覧で、店ごとに（通販）と明記している。抽選の投稿は1日3〜4件
    type: aggregator
    genres: [tcg]

# 外したアカウント（2026-11-25）
#   pokecayoyaku     ポケモンカード抽選予約速報。直近は店頭抽選（ジョーシン店頭・ヨーカドー店頭QR・ホビーステーション店頭購入）、
#                    当選発表、Amazon広告が中心で、ネット抽選の新着は0件だった
#   phu_dp           にしもと＠ガンプラ。Amazonの予約戦の実況が中心で抽選は少なく、0件だった（プレバンの抽選は p_bandai で拾う）
#
# 追加候補（調査で見つかったもの。必要に応じて上に移してください）
#   nyuka_now        入荷Now。1投稿1抽選で「WEB抽選（当選者は店頭販売）」のように受取方法を明記。予告が早いが、店頭抽選が多い
#   toreca_entry     「オンライン抽選」のまとめを1日1回。応募がネットでも受取は店頭の店が多い
#   around30owata    ポケカくん。ヨドバシ・ドット・コム「夢のお年玉箱」などゲーム・家電寄りのネット抽選。投稿は少なめ
#   melteln          Amazonの招待リクエスト（抽選）を毎日。広告リンク付きで、他のアカウントと重なりやすい
#   puramodiary      プラモ・ダイアリー。予約開始・店頭の様子が中心で、抽選情報は少なかった（2026-11 確認）
#   cardchusen_com   トレカ抽選・再販情報まとめ。約30分ごとに投稿（費用が増える）。店舗一覧は自サイト側
#   PokeGetInfoMain  ポケゲトちゃんねる。詳細は画像
#   tcg_info_navi    TCG抽選・再販ナビ（東海寄り。店頭抽選が多い）
#   kaho_memo_       カホメモ。シール・キャラグッズ
#   Yodobashi_X      ヨドバシ公式（type: retailer）。福袋抽選などゲーム機の抽選も
