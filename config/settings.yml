# 動作設定。数字を変えるだけで挙動を調整できます。

x:
  # 1回の検索で取得する最大件数（10〜100）
  max_results_per_query: 50
  # 1日に取得する投稿の上限（費用の安全装置。超えたらその日は取得しない）。
  # ふだんは監視アカウント約40件＋発見モード50件。150件で最大 約$0.75/日
  daily_post_budget: 150
  # 検索クエリの最大文字数（長すぎるとアカウントを複数クエリに分割）
  query_max_chars: 512
  # 初回（since_idがないとき）にさかのぼる時間
  first_run_lookback_hours: 24

claude:
  # 使うモデル。GitHubの Variables に CLAUDE_MODEL を設定すると、そちらが優先されます。
  model: claude-opus-5-5
  effort: low
  # モデルごとの effort（ここにないモデルは上の effort）。Haiku は標準の medium にする
  effort_by_model:
    claude-haiku-5-5: medium
  # モデル比較：最初の compare_days 日間、同じ投稿を compare_model でも読み取り、
  # 店と締切の一致率を data/compare_report.json と毎朝のダイジェストに出す（0で無効）。
  # Variables の COMPARE_MODEL を設定すると、そちらが優先されます。
  # もう一度比較したいときは data/compare_report.json を削除
  compare_model: claude-haiku-5-5
  compare_days: 7
  # 1回のリクエストにまとめる投稿数
  max_posts_per_request: 12
  # 1投稿あたり添付する画像の上限 / 1リクエストあたりの上限
  max_images_per_post: 2
  max_images_per_request: 8
  # 1日のAI呼び出し回数の上限（費用の安全装置）
  max_calls_per_day: 40

discover:
  # 発見モード：監視していないアカウントの候補を集める（1日1回）
  enabled: true
  # この日付まで実行（YYYY-MM-DD）。空にすると無期限。費用を抑えるため1週間で終える
  until: "2026-12-01"
  max_results: 50

notify:
  # 毎朝のダイジェストを送る時刻（日本時間・時）。締切が今日・明日・あさって…の抽選を日ごとに分けて1通にまとめる
  digest_hour: 7
  # ダイジェストに載せる締切の範囲（今日から何日後まで）
  digest_days: 3
  # 新着は翌朝のダイジェストにまとめる。ただし締切がこの時間以内の新着は見つけた時点ですぐ通知
  # （-1 で新着を毎回すべて通知、0 ですぐの通知はしない）
  urgent_new_hours: 36
  # 締切がこの時間以内に迫った抽選を通知（0で無効。毎朝のダイジェストがあるので既定は無効）
  closing_soon_hours: 0
  # まとめアカウントがこの日数投稿しなければ警告
  stale_days: 3

evaluate:
  # 監視アカウントの評価：直近この日数のネット抽選で、アカウントごとの件数・単独の件数と、
  # 少ないアカウントで網羅できる組み合わせを出す（一覧ページの設定画面と、週1回のダイジェストに表示）
  window_days: 14
  # 「残す」アカウントは、網羅率がこの値に届くまで多い順に選ぶ
  coverage_target: 0.95
  # ダイジェストに評価を添える曜日（0=月曜 … 6=日曜）
  weekday: 0

items:
  # 一覧に載せる受取方法：online（ネットで完結）/ unknown（判断できない）/ store（店頭応募・店頭受取・入店抽選）
  # 店舗抽選も見たいときは store を追加
  channels: [online, unknown]
  # 締切（または当選発表日）を過ぎてから保持する日数
  keep_days_after_close: 3
  # 締切が読み取れなかったアイテムを保持する日数
  keep_days_undated: 10
  # 「要確認」投稿を保持する日数
  keep_days_review: 3
