# ルール判定に使う語句。表記ゆれは自動で吸収（全角/半角、大文字/小文字）します。

# 監視アカウントの投稿を取るときに X 側で絞り込む語（どれか1つを含む投稿だけ取得・課金）
# 「予約」「受付」は通常予約や広告を、「エントリー」は楽天セールの告知を拾って費用が増えるため入れていません
query_words: [抽選, 応募, 締切, 〆切]
# X 側で除外する語（取得しない＝課金されない）。#PR は広告、当選発表まとめは結果の告知
query_exclude: ["#PR", "\"当選発表まとめ\""]

# 抽選販売であることがはっきりしている語
strong_lottery_words:
  - 抽選販売
  - 抽選受付
  - 抽選予約
  - 抽選申込
  - 抽選申し込み
  - 抽選応募
  - 抽選エントリー
  - 抽選開始
  - 応募受付
  - 抽選情報

# 抽選に関係する語（これを1つも含まない投稿は捨てる）
lottery_words: [抽選, 応募, エントリー]

# プレゼント懸賞（抽選販売ではない）
giveaway_words:
  - プレゼント
  - 名様に
  - 名様へ
  - フォロー&リポスト
  - フォロー&RT
  - フォロー&rt
  - フォローとリポスト
  - フォローとrt
  - rtキャンペーン
  - リポストキャンペーン

# 終了・結果のお知らせ（「当選発表 12/4」のような日付の案内は含めない）
closed_words:
  - 当選発表のお知らせ
  - 当選発表しました
  - 当選発表まとめ
  - 当選者
  - 抽選結果
  - 結果発表
  - 受付終了
  - 受付を終了
  - 終了しました
  - 締め切りました
  - 完売
  - 落選

# 受取方法の判定。店舗に行く必要がある抽選（店頭応募・店頭受取・入店抽選）は一覧に載せません（settings.yml の items.channels）
store_markers:
  - 店頭受取
  - 店頭受け取り
  - 店舗受取
  - 店舗受け取り
  - 店頭で応募
  - 店頭応募
  - 店頭レジ
  - 店頭にて
  - 店頭のみ
  - 店頭販売
  - 店頭掲示
  - 店頭で抽選
  - 入店抽選
  - 入店予約
  - 整理券
online_markers:
  - 通販
  - オンライン
  - online
  - ネット
  - web抽選
  - 郵送
  - 配送
  - 宅配
  - 送料
  - 発送

