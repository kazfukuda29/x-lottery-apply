name: collect

on:
  schedule:
    # 日本時間 7,9,11,13,15,17,19,21,23時（cronはUTC。GitHubの混雑で数分〜数十分遅れることがあります）
    - cron: "0 22,0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        default: auto
        options: [auto, collect, digest, discover]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          COMPARE_MODEL: ${{ vars.COMPARE_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m collector.main --mode "${{ inputs.mode || 'auto' }}"

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') の収集結果"
            git pull --rebase --autostash
            git push
          fi

      - name: Build site
        run: python -m collector.main --mode build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
